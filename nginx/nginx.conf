worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones (3000 users capacity)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Micro-caching zone (10s TTL for read-heavy public routes)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=vtu_cache:20m max_size=500m inactive=60s use_temp_path=off;

    upstream backend_cluster {
        server backend:5000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 15M;
        limit_conn conn_limit 50;

        # Health endpoint bypasses cache & rate limit
        location /health {
            proxy_pass http://backend_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Auth endpoints strict rate limit
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_cluster/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Micro-cached public endpoints (absorbed before hitting Node)
        location ~ ^/api/(leaderboard|schedule|live|events) {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Caching
            proxy_cache vtu_cache;
            proxy_cache_valid 200 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Nginx-Cache $upstream_cache_status;
        }

        # General API routing
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://backend_cluster/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
