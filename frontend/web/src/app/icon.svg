<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b1b1b"/>
      <stop offset="0.55" stop-color="#800000"/>
      <stop offset="1" stop-color="#4a0000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="6"/>
  <!-- aura glow -->
  <circle cx="256" cy="210" r="190" fill="url(#glow)"/>
  <!-- running track: three lanes curving across the bottom -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M70 410 Q256 300 442 410" stroke-width="18"/>
    <path d="M100 448 Q256 352 412 448" stroke-width="12" stroke-opacity="0.8"/>
    <path d="M136 480 Q256 404 376 480" stroke-width="8" stroke-opacity="0.6"/>
  </g>
  <!-- torch flame -->
  <path d="M256 66
           C 300 130, 352 170, 340 246
           C 332 300, 296 330, 256 334
           C 216 330, 180 300, 172 246
           C 164 196, 196 168, 214 132
           C 222 168, 236 184, 252 190
           C 240 150, 242 108, 256 66 Z"
        fill="url(#gold)"/>
  <path d="M258 168
           C 284 206, 304 232, 296 266
           C 290 292, 274 306, 256 308
           C 238 306, 222 292, 218 268
           C 214 244, 228 226, 238 210
           C 242 228, 250 236, 258 238
           C 252 214, 250 192, 258 168 Z"
        fill="url(#core)"/>
</svg>
